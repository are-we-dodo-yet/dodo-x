[workspace]
resolver = "3"
members = ["crates/dodo_cli", "crates/dodo_core"]

[workspace.dependencies]
v8 = { version = "150.4.0" } # this is out of date to match with serde_v8
color-eyre = "0.6.5"
thiserror = "2.0.21"
serde_v8 = "0.321.0"
serde = "1.0.229"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
absolute_paths = "warn"
empty_docs = "warn"
needless_pass_by_value = "warn"
needless_pass_by_ref_mut = "warn"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unreachable = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
todo = "warn"
unimplemented = "warn"
